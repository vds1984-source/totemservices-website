name: Consultation image offline browser proof

'on':
  push:
    branches: [codex/consultation-browser-check-20261128]

permissions:
  contents: read

jobs:
  offline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the test-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing repository pin, v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false
          sparse-checkout: |
            /*
            !*.mp4
          sparse-checkout-cone-mode: false

      - name: Prepare the pinned browser driver
        shell: bash
        run: |
          node --version
          test -x /usr/bin/google-chrome
          npm install --prefix "$RUNNER_TEMP/contact-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.62.1

      - name: Verify source and compare offline browser variants
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/contact-browser/node_modules/playwright-core
          PROOF_DIR: ${{ runner.temp }}/contact-proof
          TARGET: 2314ae98b1d7e07b4b8b8f5d2fbd2b29e2b89292
          SCRIPT_SHA256: 7d72a915705ebba9fb5404485017487c4dbf410f086d1e638809ac6e64fac1fd
        run: node scripts/check-consultation-image-browser.mjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # existing repository pin, v4
        with:
          name: consultation-offline-browser-proof
          path: ${{ runner.temp }}/contact-proof
          if-no-files-found: error
          retention-days: 14
