name: Consultation live browser verification

'on':
  push:
    branches: [codex/consultation-live-check-20261128]

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the test-only branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing repository pin, v7.0.1
        with:
          fetch-depth: 4
          persist-credentials: false
          sparse-checkout: |
            /*
            !*.mp4
          sparse-checkout-cone-mode: false

      - name: Prepare the pinned browser driver
        shell: bash
        run: |
          node --version
          test -x /usr/bin/google-chrome
          npm install --prefix "$RUNNER_TEMP/contact-live-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.62.1

      - name: Verify the published public page
        shell: bash
        env:
          CHROME_BIN: /usr/bin/google-chrome
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/contact-live-browser/node_modules/playwright-core
          PROOF_DIR: ${{ runner.temp }}/contact-live-proof
          SCRIPT_SHA256: 023c30343f0ec716ac1338054378bc51ca5e27f5dbd7a4ffd55d12c3838aff58
        run: node scripts/check-consultation-live.mjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # existing repository pin, v4
        with:
          name: consultation-live-browser-proof
          path: ${{ runner.temp }}/contact-live-proof
          if-no-files-found: error
          retention-days: 14
